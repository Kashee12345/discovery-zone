function drawWorld(){
  cx.fillStyle='#1a3516';
  cx.fillRect(0,0,VIEW_W,VIEW_H);
  const ox=Math.round(camX),oy=Math.round(camY);
  const tW=64,tH=32;
  for(let ty=0;ty<WORLD_H;ty+=tH){
    for(let tx=0;tx<WORLD_W;tx+=tW){
      const sx=tx-ox,sy=ty-oy;
      if(sx+tW<0||sx>VIEW_W||sy+tH<0||sy>VIEW_H)continue;
      const alt=(Math.floor(tx/tW)+Math.floor(ty/tH))%2;
      cx.fillStyle=alt?'#1e3a1a':'#1a3516';
      cx.fillRect(sx,sy,tW,tH);
    }
  }
  // Paths
  cx.fillStyle='#c8a878';cx.fillRect(0-ox,840-oy,WORLD_W,80);
  cx.fillStyle='#c8a878';cx.fillRect(1090-ox,0-oy,80,WORLD_H);
  cx.fillStyle='#b8986a';cx.fillRect(0-ox,844-oy,WORLD_W,4);cx.fillRect(1094-ox,0-oy,4,WORLD_H);
  // Trees decorative
  const trees=[[200,200],[600,1400],[1800,200],[1800,1400],[700,680],[1500,680],[200,1000],[2000,1000]];
  for(const [tx,ty] of trees){
    const sx=tx-ox,sy=ty-oy;
    if(sx<-40||sx>VIEW_W+40||sy<-40||sy>VIEW_H+40)continue;
    cx.fillStyle='#2a5520';cx.beginPath();cx.arc(sx,sy,18,0,Math.PI*2);cx.fill();
    cx.fillStyle='#1e4418';cx.beginPath();cx.arc(sx,sy,12,0,Math.PI*2);cx.fill();
    cx.fillStyle='#553311';cx.fillRect(sx-3,sy+14,6,10);
  }
  for(const b of BLDS)drawBuilding(b,ox,oy);
}

function drawBuilding(b,ox,oy){
  const bx=b.x-ox,by=b.y-oy;
  if(bx+b.w<0||bx>VIEW_W||by+b.h<0||by>VIEW_H)return;
  const style=b.style;
  let baseColor='#1a1a2a',accentColor=b.accent||'#F5A623';

  if(style==='math'){
    const g=cx.createLinearGradient(bx,by,bx,by+b.h);g.addColorStop(0,'#001840');g.addColorStop(1,'#000d28');
    cx.fillStyle=g;cx.fillRect(bx,by,b.w,b.h);
    cx.fillStyle='rgba(64,144,240,0.15)';
    for(let r=0;r<3;r++)for(let c=0;c<4;c++){cx.fillRect(bx+12+c*64,by+14+r*50,52,38);cx.strokeStyle='rgba(64,144,240,0.5)';cx.lineWidth=1;cx.strokeRect(bx+12+c*64,by+14+r*50,52,38);}
  } else if(style==='science'){
    const g=cx.createLinearGradient(bx,by,bx,by+b.h);g.addColorStop(0,'#002218');g.addColorStop(1,'#000e0a');
    cx.fillStyle=g;cx.fillRect(bx,by,b.w,b.h);
    cx.fillStyle='rgba(0,200,100,0.12)';
    for(let r=0;r<3;r++)for(let c=0;c<3;c++){cx.fillRect(bx+14+c*84,by+16+r*56,68,44);cx.strokeStyle='rgba(0,204,102,0.4)';cx.lineWidth=1;cx.strokeRect(bx+14+c*84,by+16+r*56,68,44);}
  } else if(style==='arts'){
    const g=cx.createLinearGradient(bx,by,bx,by+b.h);g.addColorStop(0,'#3a1a00');g.addColorStop(1,'#200e00');
    cx.fillStyle=g;cx.fillRect(bx,by,b.w,b.h);
    for(let r=0;r<b.h;r+=12){cx.fillStyle='rgba(140,70,0,0.18)';cx.fillRect(bx,by+r,b.w,10);}
  } else if(style==='admin'){
    const g=cx.createLinearGradient(bx,by,bx,by+b.h);g.addColorStop(0,'#3a2800');g.addColorStop(1,'#1a1000');
    cx.fillStyle=g;cx.fillRect(bx,by,b.w,b.h);
    for(let c=0;c<4;c++){cx.fillStyle='rgba(200,160,0,0.3)';cx.fillRect(bx+20+c*52,by+20,12,b.h-30);}
    cx.fillStyle='#c8a200';cx.fillRect(bx,by+b.h-20,b.w,20);
    cx.strokeStyle='rgba(245,166,35,0.8)';cx.lineWidth=3;cx.strokeRect(bx+1,by+1,b.w-2,b.h-2);
  } else if(style==='artsmusic'){
    const g=cx.createLinearGradient(bx,by,bx,by+b.h);g.addColorStop(0,'#2a0028');g.addColorStop(1,'#120014');
    cx.fillStyle=g;cx.fillRect(bx,by,b.w,b.h);
    cx.fillStyle='rgba(255,102,204,0.12)';
    for(let r=0;r<3;r++)for(let c=0;c<3;c++)cx.fillRect(bx+12+c*70,by+14+r*50,56,40);
  } else if(style==='gym'){
    const g=cx.createLinearGradient(bx,by,bx,by+b.h);g.addColorStop(0,'#2a0e00');g.addColorStop(1,'#150700');
    cx.fillStyle=g;cx.fillRect(bx,by,b.w,b.h);
    cx.fillStyle='rgba(255,102,0,0.18)';
    for(let r=0;r<4;r++)cx.fillRect(bx,by+r*(b.h/4),b.w,4);
  } else if(style==='tech'){
    const g=cx.createLinearGradient(bx,by,bx,by+b.h);g.addColorStop(0,'#001828');g.addColorStop(1,'#000c18');
    cx.fillStyle=g;cx.fillRect(bx,by,b.w,b.h);
    cx.fillStyle='rgba(0,204,255,0.12)';
    for(let r=0;r<3;r++)for(let c=0;c<3;c++){cx.fillRect(bx+12+c*82,by+14+r*50,68,40);cx.strokeStyle='rgba(0,204,255,0.35)';cx.lineWidth=1;cx.strokeRect(bx+12+c*82,by+14+r*50,68,40);}
  } else if(style==='library'){
    const g=cx.createLinearGradient(bx,by,bx,by+b.h);g.addColorStop(0,'#1e0d00');g.addColorStop(1,'#0e0600');
    cx.fillStyle=g;cx.fillRect(bx,by,b.w,b.h);
    for(let r=0;r<b.h;r+=12)cx.fillRect(bx,by+r,b.w,10);
  } else if(style==='social'){
    const g=cx.createLinearGradient(bx,by,bx,by+b.h);g.addColorStop(0,'#1a0a38');g.addColorStop(1,'#0e0520');
    cx.fillStyle=g;cx.fillRect(bx,by,b.w,b.h);
    cx.fillStyle='rgba(153,102,255,0.15)';
    for(let r=0;r<3;r++)for(let c=0;c<3;c++){cx.fillRect(bx+14+c*84,by+16+r*48,68,36);cx.strokeStyle='rgba(153,102,255,0.4)';cx.lineWidth=1;cx.strokeRect(bx+14+c*84,by+16+r*48,68,36);}
  } else {
    cx.fillStyle='#2a2a3a';cx.fillRect(bx,by,b.w,b.h);
  }

  // Accent stripe top
  cx.fillStyle=accentColor;cx.fillRect(bx,by,b.w,10);
  // Border
  cx.strokeStyle=accentColor+'99';cx.lineWidth=2;cx.strokeRect(bx+1,by+1,b.w-2,b.h-2);
  // Door
  const dw=24,dh=32;
  cx.fillStyle='rgba(0,0,0,0.75)';cx.fillRect(bx+b.w/2-dw/2,by+b.h-dh,dw,dh);
  cx.strokeStyle=accentColor;cx.lineWidth=1.5;cx.strokeRect(bx+b.w/2-dw/2,by+b.h-dh,dw,dh);
  // Sign background
  const sw=Math.min(b.w-4,144);
  cx.fillStyle='rgba(0,12,6,0.93)';cx.fillRect(bx+b.w/2-sw/2,by+b.h-56,sw,24);
  cx.strokeStyle=accentColor;cx.lineWidth=1;cx.strokeRect(bx+b.w/2-sw/2,by+b.h-56,sw,24);
  // Sign text
  cx.fillStyle=accentColor;cx.font="5px 'Press Start 2P',monospace";cx.textAlign='center';
  const lines=b.label.split('\n');
  if(lines.length===1)cx.fillText(lines[0].substring(0,20),bx+b.w/2,by+b.h-39);
  else{cx.fillText(lines[0].substring(0,18),bx+b.w/2,by+b.h-49);cx.fillText(lines[1].substring(0,18),bx+b.w/2,by+b.h-38);}
  // Emoji
  cx.font='16px serif';cx.fillText(b.emoji,bx+b.w/2,by+b.h-60);
}

function drawPlayer(){
  const sx=Math.round(px-camX),sy=Math.round(py-camY);
  const fr=Math.floor(pframe/8)%2;
  cx.fillStyle='rgba(0,0,0,0.25)';cx.fillRect(sx-PS+4,sy+PS*2-4,PS*2-8,6);
  cx.fillStyle='#F5A623';cx.fillRect(sx-PS/2,sy,PS,PS*2);
  cx.fillStyle='#333';
  if(fr===0){cx.fillRect(sx-PS/2,sy+PS*2-4,6,4);cx.fillRect(sx+PS/2-6,sy+PS*2-4,6,4);}
  else if(pdir===3){cx.fillRect(sx-PS/2-2,sy+PS*2-4,8,4);cx.fillRect(sx+PS/2-6,sy+PS*2-4,6,4);}
  else{cx.fillRect(sx-PS/2,sy+PS*2-4,6,4);cx.fillRect(sx+PS/2-4,sy+PS*2-4,8,4);}
  cx.fillStyle='#ffe0b0';cx.fillRect(sx-PS/2+1,sy-PS+1,PS-2,PS-2);
  cx.fillStyle='#553300';cx.fillRect(sx-PS/2+1,sy-PS+1,PS-2,3);
  cx.fillStyle='#333';
  if(pdir===3)cx.fillRect(sx-PS/2+2,sy-PS+4,2,2);
  else if(pdir===1)cx.fillRect(sx+PS/2-4,sy-PS+4,2,2);
  else{cx.fillRect(sx-2,sy-PS+4,2,2);cx.fillRect(sx+2,sy-PS+4,2,2);}
}

function drawMinimap(){
  mx.fillStyle='#0a1628';mx.fillRect(0,0,110,88);
  const sX=110/WORLD_W,sY=88/WORLD_H;
  mx.fillStyle='#c8a878';mx.fillRect(0,840*sY,110,80*sY);mx.fillRect(1090*sX,0,80*sX,88);
  for(const b of BLDS){mx.fillStyle=b.accent||'#F5A623';mx.fillRect(b.x*sX,b.y*sY,b.w*sX,b.h*sY);}
  mx.fillStyle='#fff';mx.fillRect(px*sX-1,py*sY-1,3,3);
  mx.strokeStyle='#F5A623';mx.lineWidth=1;mx.strokeRect(0,0,110,88);
}

document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if((e.key==='e'||e.key==='E')&&nearBuilding){
    if(document.getElementById('overlay').style.display!=='flex'&&
       document.getElementById('actModal').style.display!=='flex')
      openBuilding(nearBuilding);
  }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

function collides(nx,ny){
  for(const b of BLDS)if(nx+PS>b.x&&nx-PS<b.x+b.w&&ny+PS>b.y&&ny-PS<b.y+b.h)return true;
  return nx<PS||nx>WORLD_W-PS||ny<PS||ny>WORLD_H-PS;
}

function update(){
  if(document.getElementById('overlay').style.display==='flex'||
     document.getElementById('actModal').style.display==='flex')return;
  let dx=0,dy=0;
  if(keys['ArrowUp']||keys['w']||keys['W']){dy=-PSPEED;pdir=0;}
  if(keys['ArrowDown']||keys['s']||keys['S']){dy=PSPEED;pdir=2;}
  if(keys['ArrowLeft']||keys['a']||keys['A']){dx=-PSPEED;pdir=3;}
  if(keys['ArrowRight']||keys['d']||keys['D']){dx=PSPEED;pdir=1;}
  if(dx||dy)pframe++;else pframe=0;
  if(!collides(px+dx,py))px+=dx;
  if(!collides(px,py+dy))py+=dy;
  camX=Math.max(0,Math.min(WORLD_W-VIEW_W,px-VIEW_W/2));
  camY=Math.max(0,Math.min(WORLD_H-VIEW_H,py-VIEW_H/2));
  nearBuilding=null;
  for(const b of BLDS){
    if(px>b.x-44&&px<b.x+b.w+44&&py>b.y-44&&py<b.y+b.h+44){nearBuilding=b;break;}
  }
  const pb=document.getElementById('promptBanner');
  const loc=document.getElementById('locSpan');
  if(nearBuilding){
    pb.style.opacity='1';
    pb.textContent='Press E → '+nearBuilding.label.replace('\n',' ');
    loc.textContent='📍 '+nearBuilding.label.replace('\n',' ');
  }else{pb.style.opacity='0';loc.textContent='📍 Discovery Zone Grounds';}
}

function render(){
  cx.clearRect(0,0,VIEW_W,VIEW_H);
  drawWorld();drawPlayer();drawMinimap();
}

let lastTime=0;
function loop(ts){if(ts-lastTime>16){lastTime=ts;update();render();}requestAnimationFrame(loop);}

// ── OVERLAY ──────────────────────────────────────────────────────────────────
function openBuilding(b){
  currentBuilding=b;
  document.getElementById('ovTitle').textContent=b.label.replace('\n',' ');
  document.getElementById('ovDept').textContent=b.dept;
  document.querySelectorAll('.gradeBtn').forEach(btn=>btn.classList.toggle('active',btn.textContent==='K–5'));
  currentGrade='k5';renderActivities();
  document.getElementById('overlay').style.display='flex';
}
function closeOverlay(){document.getElementById('overlay').style.display='none';}
function setGrade(g,btn){
  currentGrade=g;
  document.querySelectorAll('.gradeBtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');renderActivities();
}
function renderActivities(){
  const grid=document.getElementById('actGrid');
  const acts=(ACTIVITIES[currentBuilding.id]&&ACTIVITIES[currentBuilding.id][currentGrade])||[];
  if(!acts.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#aaa;font-size:6px;padding:20px;">More activities coming soon!</div>';return;}
  grid.innerHTML=acts.map((a,i)=>`<div class="actCard" onclick="startActivity(${i})"><div class="actIcon">${a.icon}</div><div class="actName">${a.name}</div><div class="actDesc">${a.desc}</div></div>`).join('');
}

// ── ACTIVITY ─────────────────────────────────────────────────────────────────
let currentAct=null,currentQ=0,score=0;
function startActivity(idx){
  currentAct=ACTIVITIES[currentBuilding.id][currentGrade][idx];
  currentQ=0;score=0;
  document.getElementById('actTitle').textContent=currentAct.name;
  renderQuestion();
  document.getElementById('actModal').style.display='flex';
}
function renderQuestion(){
  const content=document.getElementById('actContent');
  const q=currentAct.quiz[currentQ];
  if(!q){
    const pct=Math.round(score/currentAct.quiz.length*100);
    content.innerHTML=`<div class="scoreBox"><div style="font-size:28px;margin-bottom:10px">${pct===100?'🏆':pct>=60?'⭐':'💪'}|/div><div>Score: ${score}/${currentAct.quiz.length} &nbsp;(${pct}%)</div><div style="font-size:5.5px;color:#aaa;margin-top:12px">${pct===100?'Perfect! You are a Discovery Zone champion!':pct>=60?'Great job! Keep exploring and learning!':'Keep practicing — every expert was once a beginner!'}</div></div>`;
    return;
  }
  content.innerHTML=`<div style="color:#aaa;font-size:5.5px;margin-bottom:8px">Question ${currentQ+1} of ${currentAct.quiz.length}</div><div class="qText">${q.q}</div>${q.choices.map((c,i)=>`<button class="choiceBtn" onclick="answer(${i})">${c}</button>`).join('')}`;
}
function answer(idx){
  const q=currentAct.quiz[currentQ];
  document.querySelectorAll('.choiceBtn').forEach((b,i)=>{
    if(i===q.a)b.classList.add('correct');
    else if(i===idx&&idx!==q.a)b.classList.add('wrong');
    b.onclick=null;
  });
  if(idx===q.a)score++;
  setTimeout(()=>{currentQ++;renderQuestion();},900);
}
function closeActivity(){document.getElementById('actModal').style.display='none';}

function hideSplash(){
  document.getElementById('splash').style.display='none';
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
